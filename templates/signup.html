{% extends "base.html" %}
{% block title %}Create account - Policy Register{% endblock %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-seal">पौ</div>
    <h1>Policy Register</h1>
    <p class="auth-sub">Create an account to start managing policies.</p>
    <form method="POST" class="auth-form">
      <label>
        <span>Username</span>
        <div class="icon-field">
          <svg class="icon-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" name="username" placeholder="Choose a username" autocomplete="username" required autofocus minlength="3">
        </div>
      </label>
      <label>
        <span>Password</span>
        <div class="icon-field">
          <svg class="icon-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6">
        </div>
      </label>
      <label>
        <span>Confirm password</span>
        <div class="icon-field">
          <svg class="icon-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" name="confirm_password" placeholder="Re-enter your password" autocomplete="new-password" required minlength="6">
        </div>
      </label>
      <button type="submit" class="btn btn-primary btn-full">Create account</button>
    </form>
    <p class="auth-hint">Already have an account? <a href="{{ url_for('login') }}">Sign in</a>.</p>
  </div>
</div>
{% endblock %}
